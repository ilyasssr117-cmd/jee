
name: iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair iOS
        shell: bash
        run: |
          chmod +x ios_setup/repair_ios.sh
          bash ios_setup/repair_ios.sh

      - name: Dependencies
        run: flutter pub get

      - name: Build iOS
        run: |
          flutter clean
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Create IPA
        shell: bash
        run: |
          set -e

          rm -rf Payload
          mkdir -p Payload

          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app

          cd Payload
          zip -r ../TV-Tube-unsigned.ipa Runner.app
          cd ..

          rm -rf Payload

          ls -lh TV-Tube-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TV-Tube-IPA
          path: TV-Tube-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
