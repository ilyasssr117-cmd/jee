name: Build TV Tube iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          architecture: arm64
          cache: true

      - name: Show Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Analyze Dart code
        continue-on-error: true
        run: flutter analyze

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          test -d build/ios/iphoneos/Runner.app

          rm -rf Payload
          rm -f TV-Tube.ipa

          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app

          /usr/bin/zip -qry TV-Tube.ipa Payload
          test -s TV-Tube.ipa

          ls -lh TV-Tube.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TV-Tube-IPA
          path: TV-Tube.ipa
          if-no-files-found: error
