
name: watch_tube
description: A TV-first video browsing app built with Flutter.
publish_to: none
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.6
  http: ^1.2.2
  html: ^0.15.4
  video_player_media_kit: ^2.0.0
  window_manager: ^0.5.1
  media_kit_libs_windows_video: any
  shared_preferences: ^2.5.3
dependency_overrides:
  video_player_avfoundation: 2.8.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
