
name: Fix Flutter + Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  fix-and-build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          architecture: arm64
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Fix scrollCacheExtent migration
        shell: python
        run: |
          from pathlib import Path

          files = [
              "lib/home_page.dart",
              "lib/video_details_page.dart",
              "lib/widgets/library_view.dart",
              "lib/widgets/search_overlay.dart",
              "lib/widgets/favorites_view.dart",
          ]

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  continue

              text = path.read_text(encoding="utf-8")

              # Fix incorrect migration:
              # cacheExtent: ... -> scrollCacheExtent: ...
              text = text.replace(
                  "cacheExtent:",
                  "scrollCacheExtent:"
              )

              # Never allow the nonexistent Flutter identifier.
              text = text.replace(
                  "ScrollCacheExtent",
                  ""
              )

              path.write_text(text, encoding="utf-8")

      - name: Fix Dart formatting
        run: dart format lib

      - name: Analyze
        run: flutter analyze

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign

      - name: Create IPA
        shell: bash
        run: |
          set -e

          rm -rf Payload
          rm -f TV-Tube.ipa

          mkdir -p Payload

          cp -R build/ios/iphoneos/Runner.app \
            Payload/Runner.app

          cd Payload
          zip -r -q ../TV-Tube.ipa Runner.app
          cd ..

          ls -lh TV-Tube.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TV-Tube-IPA
          path: TV-Tube.ipa
          if-no-files-found: error
