name: Build TV Tube iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          architecture: arm64
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Restore ScrollCacheExtent code
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              "lib/home_page.dart",
              "lib/video_details_page.dart",
              "lib/widgets/library_view.dart",
              "lib/widgets/search_overlay.dart",
          ]

          correct = """scrollCacheExtent: ScrollCacheExtent.pixels(
              MediaQuery.sizeOf(context).height,
            ),"""

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  print(f"SKIP: {filename}")
                  continue

              text = path.read_text(encoding="utf-8")

              # Fix malformed ScrollCacheExtent generated by the
              # previous workflow.
              patterns = [
                  r"scrollCacheExtent:\s*\.pixels\(\s*context\.height\s*\)",
                  r"scrollCacheExtent:\s*\.pixels\(\s*MediaQuery\.sizeOf\(context\)\.height\s*\)",
                  r"scrollCacheExtent:\s*MediaQuery\.sizeOf\(context\)\.height",
                  r"scrollCacheExtent:\s*context\.height",
              ]

              original = text

              for pattern in patterns:
                  text = re.sub(
                      pattern,
                      correct.rstrip(","),
                      text,
                      flags=re.MULTILINE,
                  )

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  print(f"FIXED: {filename}")
              else:
                  print(f"OK: {filename}")

      - name: Fix Favorites ScrollCacheExtent
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("lib/widgets/favorites_view.dart")

          if not path.exists():
              print("favorites_view.dart not found")
              raise SystemExit(0)

          text = path.read_text(encoding="utf-8")

          # Convert numeric cacheExtent values to the Flutter 3.47 API.
          text = re.sub(
              r"cacheExtent:\s*([0-9]+(?:\.[0-9]+)?)",
              r"scrollCacheExtent: ScrollCacheExtent.pixels(\1)",
              text,
          )

          path.write_text(text, encoding="utf-8")

          print("Checked favorites_view.dart")

      - name: Verify ScrollCacheExtent
        shell: bash
        run: |
          set -e

          echo "Checking ScrollCacheExtent usage..."

          grep -n "scrollCacheExtent" lib/home_page.dart || true
          grep -n "scrollCacheExtent" lib/video_details_page.dart || true
          grep -n "scrollCacheExtent" lib/widgets/library_view.dart || true
          grep -n "scrollCacheExtent" lib/widgets/search_overlay.dart || true
          grep -n "scrollCacheExtent" lib/widgets/favorites_view.dart || true

          if grep -R "scrollCacheExtent: \.pixels" lib; then
            echo "ERROR: malformed .pixels syntax still exists"
            exit 1
          fi

          if grep -R "scrollCacheExtent: context.height" lib; then
            echo "ERROR: invalid context.height still exists"
            exit 1
          fi

          echo "ScrollCacheExtent verification passed."

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Format Dart files
        run: dart format lib

      - name: Analyze
        run: flutter analyze

      - name: Build iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign

      - name: Create IPA
        shell: bash
        run: |
          set -e

          rm -rf Payload
          rm -f TV-Tube.ipa

          mkdir -p Payload

          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app

          cd Payload
          zip -r -q ../TV-Tube.ipa Runner.app
          cd ..

          echo "IPA created successfully:"
          ls -lh TV-Tube.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TV-Tube-IPA
          path: TV-Tube.ipa
          if-no-files-found: error
