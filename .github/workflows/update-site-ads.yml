name: Restore VXTUBE website

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-site-ads.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: ilyasssr117-cmd/Web
          ref: main
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Restore exact previous index.html
        shell: bash
        run: |
          set -euo pipefail
          cat > website/index.html <<'VXTUBE_RESTORE_20261113'
