name: Fix Flutter + Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  fix-and-build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          architecture: arm64
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Fix scrollCacheExtent
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              "lib/home_page.dart",
              "lib/video_details_page.dart",
              "lib/widgets/library_view.dart",
              "lib/widgets/search_overlay.dart",
              "lib/widgets/favorites_view.dart",
          ]

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  continue

              text = path.read_text(encoding="utf-8")

              # Convert:
              # cacheExtent: 500
              # or:
              # cacheExtent: ScrollCacheExtent.pixels(500)
              #
              # into:
              # scrollCacheExtent: 500

              text = re.sub(
                  r'\bcacheExtent\s*:\s*ScrollCacheExtent\.pixels\(\s*([^)]*?)\s*\)',
                  r'scrollCacheExtent: \1',
                  text,
              )

              text = re.sub(
                  r'\bscrollCacheExtent\s*:\s*ScrollCacheExtent\.pixels\(\s*([^)]*?)\s*\)',
                  r'scrollCacheExtent: \1',
                  text,
              )

              # Fix the exact broken result produced by the previous workflow:
              # scrollCacheExtent: .pixels(500)
              text = re.sub(
                  r'\bscrollCacheExtent\s*:\s*\.pixels\(\s*([^)]*?)\s*\)',
                  r'scrollCacheExtent: \1',
                  text,
              )

              # If the old property still exists with a normal value,
              # migrate only the property name.
              text = re.sub(
                  r'\bcacheExtent\s*:',
                  'scrollCacheExtent:',
                  text,
              )

              path.write_text(text, encoding="utf-8")

      - name: Show fixed lines
        run: |
          echo "Checking scrollCacheExtent..."
          grep -RIn "scrollCacheExtent" lib || true
          echo ""
          echo "Checking for broken .pixels syntax..."
          if grep -RIn "scrollCacheExtent: \.pixels" lib; then
            echo "ERROR: Broken .pixels syntax still exists."
            exit 1
          fi

      - name: Format Dart
        run: dart format lib

      - name: Analyze
        run: flutter analyze

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign

      - name: Create IPA
        shell: bash
        run: |
          set -e

          rm -rf Payload
          rm -f TV-Tube.ipa

          mkdir -p Payload

          cp -R build/ios/iphoneos/Runner.app \
            Payload/Runner.app

          cd Payload
          zip -r -q ../TV-Tube.ipa Runner.app
          cd ..

          echo "IPA created:"
          ls -lh TV-Tube.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TV-Tube-IPA
          path: TV-Tube.ipa
          if-no-files-found: error
