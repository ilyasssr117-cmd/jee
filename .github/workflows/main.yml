name: Build TV Tube iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          architecture: arm64
          cache: true

      # --------------------------------------------------
      # 3. Show environment
      # --------------------------------------------------
      - name: Flutter environment
        run: |
          flutter --version
          dart --version
          xcodebuild -version
          pod --version

      # --------------------------------------------------
      # 4. Create iOS project if ios/ does not exist
      # --------------------------------------------------
      - name: Create iOS project
        shell: bash
        run: |
          set -e

          if [ ! -d "ios" ]; then
            echo "ios/ does not exist."
            echo "Creating iOS platform..."

            flutter create \
              --platforms=ios \
              --project-name watch_tube \
              --org com.tv \
              --no-pub \
              .

            echo "iOS project created."
          else
            echo "ios/ already exists. Keeping existing iOS project."
          fi

      # --------------------------------------------------
      # 5. Verify iOS project
      # --------------------------------------------------
      - name: Verify iOS project
        shell: bash
        run: |
          set -e

          test -d ios
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Podfile
          test -f ios/Runner/Info.plist

          echo "iOS project is valid."
          echo
          echo "iOS files:"
          find ios -maxdepth 2 -type f | sort | head -100

      # --------------------------------------------------
      # 6. Configure iOS deployment target
      # --------------------------------------------------
      - name: Configure iOS deployment target
        shell: bash
        run: |
          set -e

          if grep -q "^platform :ios" ios/Podfile; then
            sed -i '' "s/^platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          else
            sed -i '' "1i\\
platform :ios, '15.0'\\
" ios/Podfile
          fi

          echo "Podfile platform:"
          head -10 ios/Podfile

      # --------------------------------------------------
      # 7. Get Flutter dependencies
      # --------------------------------------------------
      - name: Flutter pub get
        run: |
          flutter pub get

      # --------------------------------------------------
      # 8. Install CocoaPods
      # --------------------------------------------------
      - name: Install CocoaPods dependencies
        working-directory: ios
        shell: bash
        run: |
          set -e

          pod deintegrate || true
          pod install --repo-update

      # --------------------------------------------------
      # 9. Analyze Dart project
      # --------------------------------------------------
      - name: Flutter analyze
        run: |
          flutter analyze

      # --------------------------------------------------
      # 10. Clean build
      # --------------------------------------------------
      - name: Flutter clean
        run: |
          flutter clean
          flutter pub get

      # --------------------------------------------------
      # 11. Build unsigned iOS app
      # --------------------------------------------------
      - name: Build iOS release
        run: |
          flutter build ios \
            --release \
            --no-codesign

      # --------------------------------------------------
      # 12. Verify Runner.app
      # --------------------------------------------------
      - name: Verify iOS app
        shell: bash
        run: |
          set -e

          APP_PATH="build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app was not created."
            exit 1
          fi

          echo "Runner.app created successfully:"
          ls -lah build/ios/iphoneos/

      # --------------------------------------------------
      # 13. Create unsigned IPA
      # --------------------------------------------------
      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          rm -rf Payload
          rm -f TV-Tube.ipa

          mkdir -p Payload

          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app

          zip -r -q TV-Tube.ipa Payload

          echo "IPA created:"
          ls -lh TV-Tube.ipa

      # --------------------------------------------------
      # 14. Upload IPA
      # --------------------------------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TV-Tube-IPA
          path: TV-Tube.ipa
          if-no-files-found: error

      # --------------------------------------------------
      # 15. Upload build logs if something fails
      # --------------------------------------------------
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            ios/Podfile
            ios/Podfile.lock
            build/ios/**
          if-no-files-found: ignore
