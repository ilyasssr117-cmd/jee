name: Add iOS Platform

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          architecture: arm64
          cache: true

      - name: Check existing iOS
        shell: bash
        run: |
          if [ -d "ios" ]; then
            echo "ios/ already exists."
            echo "Nothing to create."
            exit 0
          fi

          echo "ios/ does not exist."
          echo "Creating iOS platform..."

      - name: Create iOS platform
        shell: bash
        run: |
          set -e

          flutter create \
            --platforms=ios \
            --project-name watch_tube \
            --org com.tv \
            --no-pub \
            .

          echo ""
          echo "===== iOS directory ====="
          ls -la ios

          echo ""
          echo "===== Runner directory ====="
          ls -la ios/Runner

      - name: Verify iOS platform
        shell: bash
        run: |
          set -e

          echo "Checking iOS platform..."

          if [ ! -d "ios" ]; then
            echo "ERROR: ios directory was not created."
            exit 1
          fi

          if [ ! -d "ios/Runner" ]; then
            echo "ERROR: ios/Runner was not created."
            exit 1
          fi

          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "ERROR: Xcode project was not created."
            exit 1
          fi

          if [ ! -f "ios/Runner/Info.plist" ]; then
            echo "ERROR: Runner/Info.plist was not created."
            exit 1
          fi

          echo ""
          echo "iOS platform verified successfully."

      - name: Commit iOS platform
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ios/

          if git diff --cached --quiet; then
            echo "No iOS changes to commit."
            exit 0
          fi

          git commit -m "Add iOS platform"

      - name: Push iOS platform
        shell: bash
        run: |
          set -e

          git push origin HEAD:main

          echo ""
          echo "================================"
          echo "iOS platform added successfully!"
          echo "================================"
