name: Build TV Tube iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          architecture: arm64
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Analyze
        run: flutter analyze

      - name: Build iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign

      - name: Create IPA
        shell: bash
        run: |
          set -e

          rm -rf Payload
          rm -f TV-Tube.ipa

          mkdir -p Payload

          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app

          cd Payload
          zip -r -q ../TV-Tube.ipa Runner.app
          cd ..

          echo "IPA created:"
          ls -lh TV-Tube.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TV-Tube-IPA
          path: TV-Tube.ipa
          if-no-files-found: error
