
name: iOS Build Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ios-build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show environment versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Get dependencies
        id: dependencies
        shell: bash
        run: |
          set +e
          set -o pipefail
          flutter pub get --verbose 2>&1 | tee pub-get.log
          result=${PIPESTATUS[0]}
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Analyze Dart code
        id: analyze
        shell: bash
        run: |
          set +e
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee flutter-analyze.log
          result=${PIPESTATUS[0]}
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build iOS with detailed logs
        id: ios_build
        shell: bash
        run: |
          set +e
          set -o pipefail
          flutter build ios --release --no-codesign --verbose 2>&1 | tee ios-build.log
          result=${PIPESTATUS[0]}
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            pub-get.log
            flutter-analyze.log
            ios-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report final status
        if: always()
        shell: bash
        env:
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outputs.result }}
          ANALYZE_RESULT: ${{ steps.analyze.outputs.result }}
          BUILD_RESULT: ${{ steps.ios_build.outputs.result }}
        run: |
          if [[ "$DEPENDENCIES_RESULT" != "0" ||
                "$ANALYZE_RESULT" != "0" ||
                "$BUILD_RESULT" != "0" ]]; then
            echo "Build or diagnostics failed. Download ios-build-diagnostics to inspect logs."
            exit 1
          fi
          echo "All diagnostics and the iOS build succeeded."
