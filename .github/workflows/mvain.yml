name: Build TV Tube iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          architecture: arm64
          cache: true

      - name: Show Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Fix Dart SDK constraint and cache extent API
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          # Enable Dart 3.12 language features used by inferred constructors.
          pubspec = Path("pubspec.yaml")

          if not pubspec.exists():
              sys.exit("ERROR: pubspec.yaml was not found.")

          content = pubspec.read_text(encoding="utf-8")

          updated, count = re.subn(
              r'(?m)^(\s*sdk:\s*["\'])>=[0-9]+\.[0-9]+\.[0-9]+'
              r'(\s+<4\.0\.0["\']\s*)$',
              r'\g<1>>=3.12.0\g<2>',
              content,
              count=1,
          )

          if count != 1:
              if not re.search(
                  r'(?m)^\s*sdk:\s*["\']>=3\.12\.0\s+<4\.0\.0["\']',
                  content,
              ):
                  sys.exit(
                      "ERROR: Could not safely update the Dart SDK "
                      "constraint in pubspec.yaml."
                  )
          else:
              pubspec.write_text(updated, encoding="utf-8")

          # Use inferred constructors instead of the unavailable public name.
          for path in Path("lib").rglob("*.dart"):
              original = path.read_text(encoding="utf-8")
              fixed = re.sub(
                  r'\bScrollCacheExtent\s*\.\s*(pixels|viewport)\s*\(',
                  r'.\1(',
                  original,
              )

              # Migrate numeric cacheExtent in favorites_view.dart.
              if path.as_posix() == "lib/widgets/favorites_view.dart":
                  fixed = re.sub(
                      r'\bcacheExtent\s*:\s*([0-9]+(?:\.[0-9]+)?)',
                      r'scrollCacheExtent: .pixels(\1)',
                      fixed,
                  )

              if fixed != original:
                  path.write_text(fixed, encoding="utf-8")
                  print(f"Updated: {path}")

          print("Source compatibility patch completed.")

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Format Dart code
        run: dart format lib

      - name: Verify cache extent syntax
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          problems = []

          for path in Path("lib").rglob("*.dart"):
              text = path.read_text(encoding="utf-8")

              if re.search(r'\bScrollCacheExtent\s*\.', text):
                  problems.append(
                      f"{path}: explicit ScrollCacheExtent reference remains"
                  )

              if re.search(
                  r'\bscrollCacheExtent\s*:\s*\.\s*(pixels|viewport)\s*\(',
                  text,
              ):
                  # The short constructor form is intentional. The SDK
                  # constraint above enables Dart's dot-shorthand syntax.
                  pass

          if problems:
              print("\n".join(problems))
              sys.exit(1)

          print("Cache extent syntax check passed.")

      - name: Analyze Dart code
        continue-on-error: true
        run: flutter analyze

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          test -d build/ios/iphoneos/Runner.app

          rm -rf Payload
          rm -f TV-Tube.ipa

          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app

          /usr/bin/zip -qry TV-Tube.ipa Payload
          test -s TV-Tube.ipa

          ls -lh TV-Tube.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TV-Tube-IPA
          path: TV-Tube.ipa
          if-no-files-found: error
