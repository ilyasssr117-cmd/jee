  <script>
    const langBtn=document.getElementById('langBtn');
    const languageStorageKey='vxtube-site-language';
    let currentLang='ar';
    function readSavedLanguage(){try{const saved=localStorage.getItem(languageStorageKey);return saved==='en'?'en':'ar';}catch(error){return 'ar';}}
    function setLang(lang,{animate=true,persist=true}={}){
      const nextLang=lang==='en'?'en':'ar';const changed=nextLang!==currentLang;
      if(animate&&changed)document.body.classList.remove('lang-switching');
      currentLang=nextLang;document.documentElement.lang=nextLang;document.documentElement.dir=nextLang==='ar'?'rtl':'ltr';
      document.querySelectorAll('[data-ar][data-en]').forEach(el=>{el.innerHTML=el.dataset[nextLang];});
      langBtn.textContent=nextLang==='ar'?'EN':'عربي';langBtn.setAttribute('aria-label',nextLang==='ar'?'Switch language to English':'تغيير اللغة إلى العربية');
      document.title=nextLang==='ar'?'VXTUBE — مساحة مشاهدة للبالغين 18+':'VXTUBE — Adult video viewing experience 18+';
      if(persist){try{localStorage.setItem(languageStorageKey,nextLang);}catch(error){/* Storage may be disabled by the browser. */}}
      if(animate&&changed){void document.body.offsetWidth;document.body.classList.add('lang-switching');}
    }
    langBtn.addEventListener('click',()=>setLang(currentLang==='ar'?'en':'ar'));
    setLang(readSavedLanguage(),{animate:false,persist:false});
    document.getElementById('year').textContent=new Date().getFullYear();
  </script>
