name: Add iOS Platform

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          architecture: arm64
          cache: true

      - name: Check iOS platform
        shell: bash
        run: |
          if [ -d "ios" ]; then
            echo "ios/ already exists."
            echo "Nothing to do."
            exit 0
          fi

          echo "ios/ does not exist."
          echo "Creating iOS platform..."

      - name: Create iOS platform
        shell: bash
        run: |
          if [ ! -d "ios" ]; then
            flutter create \
              --platforms=ios \
              --project-name watch_tube \
              --org com.tv \
              --no-pub \
              .
          fi

      - name: Verify iOS platform
        shell: bash
        run: |
          set -e

          test -d ios
          test -f ios/Podfile
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner/Info.plist

          echo "iOS platform successfully created."

      - name: Configure iOS deployment target
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          podfile = Path("ios/Podfile")
          text = podfile.read_text()

          if "platform :ios" in text:
              lines = text.splitlines()
              lines = [
                  "platform :ios, '15.0'"
                  if line.strip().startswith("platform :ios")
                  else line
                  for line in lines
              ]
              text = "\n".join(lines) + "\n"
          else:
              text = "platform :ios, '15.0'\n\n" + text

          podfile.write_text(text)
          PY

          echo "Configured iOS deployment target:"
          head -5 ios/Podfile

      - name: Get Flutter dependencies
        run: |
          flutter pub get

      - name: Commit iOS platform
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ios

          if git diff --cached --quiet; then
            echo "No iOS changes to commit."
            exit 0
          fi

          git commit -m "Add iOS platform to Flutter project"

      - name: Push iOS platform
        shell: bash
        run: |
          set -e
          git push origin HEAD:main
